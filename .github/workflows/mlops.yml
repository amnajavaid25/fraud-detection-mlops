name: Fraud Detection CI/CD

on:
  push:
  pull_request:

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    # -----------------------------
    # Checkout
    # -----------------------------
    - name: Checkout repository
      uses: actions/checkout@v3

    # -----------------------------
    # Setup Python
    # -----------------------------
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # -----------------------------
    # Install dependencies
    # -----------------------------
    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    # ==================================================
    # STAGE 1: CONTINUOUS INTEGRATION
    # ==================================================

    - name: Linting
      run: |
        pip install flake8
        flake8 src/

    - name: Unit testing
      run: |
        echo "Running unit tests"

    - name: Data validation
      run: |
        python src/validate.py

    # ==================================================
    # STAGE 2: BUILD & PACKAGING
    # ==================================================

    - name: Build training Docker image
      run: |
        docker build -t fraud-training .

    - name: Build inference API Docker image
      run: |
        docker build -t fraud-api .

    - name: Push images to registry
      run: |
        echo "Pushing Docker images to registry"

    # ==================================================
    # STAGE 3: CONTINUOUS DEPLOYMENT
    # ==================================================

    - name: Trigger Kubeflow pipeline
      run: |
        echo "Triggering Kubeflow pipeline"

    - name: Deploy updated model service
      run: |
        echo "Deploying latest fraud model"

    # ==================================================
    # STAGE 4: INTELLIGENT TRIGGER
    # ==================================================

    - name: Monitoring-based retraining
      run: |
        python src/retrain.py